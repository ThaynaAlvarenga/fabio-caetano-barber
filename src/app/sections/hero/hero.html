<section class="hero">
  <div class="hero-content">

    <p class="hero-eyebrow">
      BARBEARIA EM AVARÉ
    </p>

    <h1>
      Seu estilo.
      <span>Sua presença.</span>
    </h1>

    <p class="hero-description">
      Cortes, barba e cuidado com o seu visual,
      em um atendimento que entende o que você procura.
    </p>

    <div class="hero-actions">
      <a
        href="https://loja.infinitepay.io/booking/fabio_caetano_campos_"
        target="_blank"
        rel="noopener noreferrer"
        class="primary-button"
      >
        Agendar horário
      </a>

      <a
        href="#servicos"
        class="secondary-button"
      >
        Conhecer serviços
      </a>
    </div>

  </div>

  <div class="hero-visual">
    @defer (on viewport) {
      <app-fc-three />
    } @placeholder {
      <div class="fc-three-placeholder" aria-hidden="true"></div>
    }
  </div>
</section>
